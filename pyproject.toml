[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "module-aging"
version = "0.2.0"
description = "Single-cell framework with built-in controls for module- and cell-type-resolved transcriptomic clocks: competitive nulls, composite decomposition and a diagnostic checklist for cross-cohort non-replication."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "Juwon Kang", email = "juwonk@yonsei.ac.kr" },
  { name = "Dongkyu Jeon" },
  { name = "Junjeong Choi", email = "junjeong@yonsei.ac.kr" },
]
dependencies = [
  "numpy",
  "pandas",
  "scipy",
  "scikit-learn",
  "statsmodels",
  "matplotlib",
  "joblib",
  "pillow",
]

[project.urls]
Repository = "https://github.com/juwonk-yonsei/module-aging-toolkit"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
